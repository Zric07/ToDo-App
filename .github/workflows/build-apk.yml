name: Build APK - Production with Bundled Assets

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular (Production)
        run: npm run build -- --configuration production
        continue-on-error: false

      - name: Verify Angular dist folder
        run: |
          echo "✅ Verifying Production build..."
          if [ -d "dist/frontend/browser" ]; then
            echo "✅ dist/frontend/browser exists"
            echo "Files:"
            ls -lh dist/frontend/browser/ | grep -E "\.js|\.css|index"
          else
            echo "❌ dist/frontend/browser NOT found!"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync (Bundle Assets)
        run: npx cap sync android
        continue-on-error: false

      - name: Verify Android assets synced
        run: |
          echo "✅ Verifying bundled assets in Android..."
          if [ -d "android/app/src/main/assets/public" ]; then
            echo "✅ Android assets folder exists"
            echo "Asset files:"
            find android/app/src/main/assets/public -type f -name "*.js" -o -name "*.css" -o -name "index.html" | head -20
          else
            echo "❌ Android assets NOT synced!"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Debug)
        run: cd android && ./gradlew clean assembleDebug --stacktrace
        continue-on-error: false

      - name: Verify APK contains bundled assets
        run: |
          echo "✅ Checking APK contents..."
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "✅ APK found: $APK_PATH"
          echo "APK size: $(ls -lh $APK_PATH | awk '{print $5}')"
          
          # Check if APK contains assets
          if unzip -t "$APK_PATH" | grep -q "assets/public"; then
            echo "✅ APK contains bundled assets (NOT dev-server!)"
          else
            echo "⚠️  Warning: No assets found in APK"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk