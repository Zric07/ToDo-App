<div class="container">
    <h1>Aufgabe bearbeiten</h1>
    <button class="back-btn" (click)="back()">
        <mat-icon>arrow_back</mat-icon>
    </button>
    
    <input class="name-input" [(ngModel)]="name" placeholder="Aufgabe" />
    <textarea class="description-input" [(ngModel)]="description" placeholder="Beschreibung"></textarea>

    <button class="edit-btn" (click)="save()">Änderungen speichern</button>
    <button class="delete" (click)="delete()">
        <mat-icon>delete</mat-icon> Aufgabe löschen
    </button>
</div>
