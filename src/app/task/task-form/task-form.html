<div class="container">
  <h1>Aufgabe hinzufügen</h1>
  <button class="back-btn" (click)="back()"><mat-icon>arrow_back</mat-icon></button>
  <input class="name-input" [(ngModel)]="name" placeholder="Aufgabe" />
  <textarea class="description-input" [(ngModel)]="description" placeholder="Beschreibung" rows="6"></textarea>

  <button class="add-btn" (click)="create()">Hinzufügen</button>
</div>
