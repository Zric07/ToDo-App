<div>
    @for(todo of todos; track todo.id){
    <div class="todo-item">
        <input type="checkbox" [checked]="todo.completed" (change)="toggle(todo)">
        <div>{{todo.name}}</div>
        <button class="delete-btn" (click)="delete(todo)"><mat-icon>delete</mat-icon></button>
    </div>
    }
</div>

<button class="add-fab" (click)="openForm()">
    <mat-icon>add</mat-icon>
</button>
