@if(isLoading()) {
<div class="loading-container">
    <div class="spinner"></div>
</div>
} @else {
<div class="header-row">
    <div class="categoryCount">{{categories().length}} Kategorien</div>
</div>

<div class="categoryContainer">
    <div class="category-item" id="daily" (click)="toggleCategory(1)">
        <div></div>
        <div class="category-bottom">
            <div class="category-name">Tägliche Aufgaben</div>
            <div class="task-count">{{getTaskCount(1)}} Aufgaben</div>
        </div>
    </div>


    @for(category of categories(); track category.id){
    <div class="category-item" (click)="toggleCategory(category.id)"
        [style.backgroundImage]="category.image ? 'url(' + category.image + ')' : null" 
        (touchstart)="onTouchStart(category)" (touchend)="onTouchEnd()">
        <div></div>
        <div class="category-bottom">
            <div class="category-name">{{category.name}}</div>
            <div class="task-count">{{getTaskCount(category.id)}} Aufgaben</div>
        </div>
    </div>
    } @empty {
    }
</div>

<button class="add" (click)="openForm()">
    <mat-icon>add</mat-icon>
</button>


<div class="overlay-menu" [class.show]="showMenu()">
    <div class="overlay-backdrop" (click)="closeMenu()"></div>
    <div class="overlay-content">
        <h3>{{selectedCategory()?.name}}</h3>
        <div class="overlay-buttons">
            <button class="edit-btn" (click)="edit(selectedCategory())">
                <mat-icon>edit</mat-icon> Bearbeiten
            </button>
            <button class="delete-btn-overlay" (click)="delete(selectedCategory()?.id)">
                <mat-icon>delete</mat-icon> Löschen
            </button>
        </div>
    </div>
</div>
}
